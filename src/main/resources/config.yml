# ====
# SwagJobs Configuration
# ====

database:
  type: SQLITE
  file: SwagJobs.db

anticheat:
  enabled: true
  sample-size: 20
  min-variance: 4.0
  max-actions-per-second: 20.0
  min-cps: 20.0
  max-cps: 100.0
  alert-cooldown-seconds: 6
  ignore-enchants:
    - trench
    - veinminer
    - auto-smelt
  ignore-ae-enchants:
    - trench
    - veinminer
    - auto-smelt

place-break-max-cycles: 3
place-break-timeout-seconds: 120
track-exploit-blocks:
  - MELON_BLOCK
  - PUMPKIN
  - MELON

xp:
  max-level: 100
  base-xp-per-level: 250.0

money:
  base-money-per-level: 6.25
  money-per-xp: 0.02
  enabled: true

rank-multipliers:
  member: 1.0
  axolotl: 1.05
  lizard: 1.1
  flea: 1.15

rank-caps:
  member: 10
  axolotl: 15
  lizard: 20
  flea: 25

prestige:
  enabled: true
  max-prestige: 10
  xp-gain-per-prestige: 0.02
  money-per-prestige: 0.08
  xp-requirement-per-prestige: 0.05
  reset-level-on-prestige: true
  keep-unclaimed-rewards: true

prestige-shop:
  enabled: true
  items:
    spawner_key:
      name: '&6&lSpawner Key'
      lore:
        - '&7Unlock a random spawner!'
        - '&7Cost: &e5 Prestige Points'
      cost: 5
      material: TRIPWIRE_HOOK
      commands:
        - crate givekey %player% spawner 1
    vote_key:
      name: '&b&lVote Key'
      lore:
        - '&7A vote crate key!'
        - '&7Cost: &e2 Prestige Points'
      cost: 2
      material: TRIPWIRE_HOOK
      commands:
        - crate givekey %player% vote 1
    rank_voucher:
      name: '&d&lRank Voucher'
      lore:
        - '&7Upgrade your rank!'
        - '&7Cost: &e15 Prestige Points'
      cost: 15
      material: PAPER
      commands:
        - rankvoucher give %player% 1
    iron_spawner:
      name: '&7&lIron Golem Spawner'
      lore:
        - '&7Spawn iron golems!'
        - '&7Cost: &e10 Prestige Points'
      cost: 10
      material: IRON_BLOCK
      commands:
        - spawner give %player% IRON_GOLEM 1

boss-bar:
  enabled: true
  color: GREEN
  style: SOLID
  hide-delay: 2.5
  title: '&a{job} &7| &fLevel {level} &7| &e{xp}/{xp_required} XP &7({percentage}%) &7| &dPrestige {prestige}'

block-caps:
  enabled: true
  blocks:
    FURNACE:
      member: 10
      axolotl: 15
      lizard: 20
      flea: 25
    BLAST_FURNACE:
      member: 10
      axolotl: 15
      lizard: 20
      flea: 25
    SMOKER:
      member: 10
      axolotl: 15
      lizard: 20
      flea: 25
    BREWING_STAND:
      member: 10
      axolotl: 15
      lizard: 20
      flea: 25

